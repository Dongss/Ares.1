# 全局配置示例：复制到数据目录（默认 ~/.ares1）下的 config.yaml。
# 保存后自动生效；port 和 bins 要重启 Master 才生效。
# 每一项都可以不写，不写就用注释里说的默认值。写错的键（比如 upgarde:）会被忽略，看板「配置」页会给出警告。
#
# 仓库的路径、目标分支、检查命令和准备命令不在这里，在看板的「仓库」页登记（见 README.md）。

# 语言：zh（中文）/ en（English），默认 zh；第一次启动时按系统语言写入。
# Master 写的 issue 评论、通知、给 Agent 的提示词（Agent 也会用它回答）都用这个语言，它也是看板的默认语言
# （看板顶栏可以单独切换，选择保存在浏览器里）
language: zh

# 看板和 API 的端口，默认 4870；启动时的 --port 参数优先。Master 只监听 127.0.0.1
port: 4870

# 各个 CLI 的可执行文件，键是 agents.yaml 里的 cli。写命令名就从 PATH 里找（和不写一样），
# 不在 PATH 上或者想用指定的版本时写绝对路径，比如 /opt/homebrew/bin/claude
bins:
  claude-code: claude
  cursor-agent: cursor-agent

defaults:
  timeout_minutes: 60          # 单次 Agent 执行的超时（分钟），默认 60。agents.yaml 里 Agent 的 timeout_minutes、
                               # 模板阶段的 timeout_minutes 优先（阶段 > Agent > 这里）
  command_timeout_minutes: 20  # 单条检查命令、准备命令、命令阶段里每条命令的超时（分钟），默认 20

# 同时执行几个 Run。不同仓库的 Run 本来就可以同时执行；这里管的是同一个仓库里的
concurrency:
  per_repo: 2                  # 同一仓库最多同时执行几个 Run，默认 1（一个接一个），必须是不小于 1 的整数。
                               # 每个 Run 在自己的工作目录和分支上做，编码、评审、检查命令同时进行；合并阶段仍按仓库
                               # 一个一个来，后合并的 Run 会先合入前面合并的提交、重跑检查。大于 1 时吞吐更高，
                               # 但检查命令会同时运行（更吃 CPU 和内存），改到同一处的 Run 更容易合并冲突、返工。
                               # 登记到同一路径的仓库共用这个上限

# 用 GitHub Issues 管理需求：Run 只从带 ares1:ready 标签的 issue 来。需要安装并登录 gh；不写 github 就不接入
github:
  # account: my-account        # 用 gh 的哪个账号（登录了多个账号时）；不写 = gh 当前的账号
  poll_minutes: 5              # 多久查一次带 ares1:ready 标签的 issue、同步 issue 上的回复，默认 5

  # 键是看板「仓库」页登记的仓库名，必须和那里的名字一模一样；没写进来的仓库不接 GitHub
  repos:
    # 前端项目：每次合并前跑 E2E，有这道保险就让低风险的提案自动采纳、自动合并、自动推送
    my-web:
      issues_repo: my-org/my-web # 在哪个 GitHub 仓库读写 issue（owner/name）；不写 = 由 gh 按本地仓库的 remote 推断
      template: with-e2e       # 从 issue 建 Run 用的模板，即 workflows/ 里模板的 id
      scout:                   # AI 侦察：读代码、文档和 Run 记录，把发现的需求提成带 ares1:proposal 标签的 issue；不写 = 不侦察
        agent: claude-reviewer # 只能用 claude-code 的 Agent，以只读方式运行
        auto: true             # true（默认）= 仓库没有会自己往下走的 Run 时自动侦察；false = 只在看板上手动触发
        interval_minutes: 360  # 两次自动侦察至少间隔几分钟，默认 0（不限）。没找到需求或失败后另有退避，最长 6 小时
        max_proposals: 3       # 一次最多提几条，默认 5（1 到 20）；等你处理的提案加上卡住的 Run 达到这个数就不再自动侦察
      auto_accept:             # 不经过人，自动给提案加上 ares1:ready
        max_risk: low          # 自动采纳到哪个风险等级：none（默认，都由人采纳）/ low / mid / high
        # max_size: L          # 自动采纳到哪个大小：S / M / L（默认）；和 max_risk 一起决定，两项都不超过才自动采纳
        max_per_day: 3         # 每天最多自动采纳几条；不写 = 不限
      auto_merge: true         # true = 从 issue 来的 Run 合并前不等人审批（模板里其他阶段的审批照旧）；默认 false
      push: true               # true = 合并后把目标分支推送到 GitHub，每轮检查时也把 GitHub 上的新提交
                               # 快进到本地目标分支；默认 false，只合并到本地仓库
      daily_budget_usd: 20     # 当天侦察、自动采纳的 Run 和自动重做的 Run 一共花到这么多（美元）后，停止这些自动行为，
                               # 第二天恢复；人手动加 ares1:ready 的 Run 不受影响。不写 = 不限
      max_run_attempts: 3      # 一个 issue 最多跑几次 Run（含第一次）：失败后自动重做，带上之前失败的原因；
                               # 用完就关闭 issue 并写明每次的原因。默认 3；1 = 不重做

    # 生产服务：严格模板，提案和合并都由人把关，不自动推送
    my-api:
      template: strict
      scout:
        agent: claude-reviewer
        auto: false            # 只在看板上手动触发侦察
      auto_accept:
        max_risk: none         # 所有提案都由人决定
      auto_merge: false        # 合并前一定等人审批（strict 模板的合并阶段设了 gate: true）
      push: false
      daily_budget_usd: 30
      max_run_attempts: 2      # 失败后只自动重做 1 次，之后关闭 issue 等人看

    # 文档仓库：轻量模板，不侦察（没写 scout），需求由人写 issue；改动小，直接合并、推送
    my-docs:
      template: light
      auto_merge: true
      push: true
      daily_budget_usd: 5

    # 命令行工具：编码和评审用不同厂商的 Agent 交叉评审
    my-tool:
      template: cross-review
      scout:
        agent: claude-reviewer
        # auto、interval_minutes、max_proposals 不写，用默认值：自动侦察、不限间隔、一次最多 5 条
      auto_accept:
        max_risk: mid          # 中低风险的提案自动采纳
        # max_per_day 不写 = 每天不限
      daily_budget_usd: 15
      # auto_merge、push 不写 = false：合并前等人审批，合并后不推送

# 需要人处理时（Run 卡住或失败、等审批、提案等人决定、推送或升级失败），Master 直接发系统通知，不用开着看板。
# macOS 用通知中心；Linux 需要 notify-send（libnotify）；其他平台不支持，仍由浏览器发通知
notify:
  system: true                 # 默认 false
  # 人不在这台机器前也想收到（比如 Master 跑在没有桌面的服务器上）：把同样的通知 POST 到这个地址。
  # 不写 = 不发；和 system 互不影响。失败不重试，连续失败时在 Master 的输出和看板「事件」页记一次原因，
  # 有通知发送成功后再失败时重新记。正文格式见 docs/running.md
  # webhook:
  #   url: https://ntfy.sh/<你的主题>   # 必填，只能是 http:// 或 https:// 开头；地址里不能带用户名和密码
  #   headers:                         # 可选：额外的请求头，比如鉴权
  #     Authorization: Bearer <你的 token>
  #   format: text                     # json（默认，{ kind, title, body, text, runId, ... }）/ text（「标题\n正文」，适合 ntfy）

# 自动升级：Master 的安装目录（稳定副本）落后于它的 git origin 时，等手上的工作做完后拉取、构建并重启，
# 失败自动回退到旧版本。Master 要从稳定副本的构建（dist/cli.js）启动，见 docs/running.md
upgrade:
  auto: false                  # 默认 false；只想用 Master 开发别的项目、不跟着上游更新时保持 false
